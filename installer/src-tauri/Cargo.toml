[package]
name = "telecloud-installer"
version = "1.1.3"
description = "TeleCloud Custom Frameless Windows Installer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.0", features = ["image-png", "image-ico", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
winreg = "0.52"
mslnk = "0.1"

[[bin]]
name = "TeleCloud-Setup"
path = "src/main.rs"

[[bin]]
name = "uninstall"
path = "src/bin/uninstall.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
